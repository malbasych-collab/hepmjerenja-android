name: Izradi HEP Mjerenja APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instaliraj Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Raspakiraj projekt
        run: |
          unzip -o HEP-Mjerenja-Android-1.0-source.zip

      - name: Uskladi HEP HTTP zahtjev s izvornim Go klijentom
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('hepmjerenja-android-final/app/src/main/java/hr/hepmjerenja/mobile/HepApi.java')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'private static final String BASE="https://mjerenje.hep.hr/mjerenja/v1/api";',
              'private static final String BASE="https://mjerenje.hep.hr/mjerenja/v1.1/api";'
          )

          s = s.replace(
              'c.setConnectTimeout(20000); c.setReadTimeout(30000); c.setInstanceFollowRedirects(false);',
              'c.setConnectTimeout(20000); c.setReadTimeout(30000); c.setInstanceFollowRedirects(true);'
          )

          s = s.replace(
              'c.setRequestMethod("POST"); c.setRequestProperty("Accept","application/json, text/plain, */*");',
              'c.setRequestMethod("POST"); c.setRequestProperty("User-Agent","Go-http-client/1.1"); c.setRequestProperty("Accept","application/json, text/plain, */*");'
          )

          s = s.replace(
              'c.setDoOutput(true); c.setRequestProperty("Content-Type","application/json; charset=utf-8");\n                byte[] bytes=payload.getBytes("UTF-8"); c.setFixedLengthStreamingMode(bytes.length);',
              'c.setDoOutput(true); c.setRequestProperty("Content-Type","application/json");\n                byte[] bytes=payload.getBytes("UTF-8");'
          )

          s = s.replace(
              '} else if(status!=200) throw new ApiException("HEP trenutačno ne može obraditi zahtjev (HTTP "+status+").",false);',
              '''} else if(status!=200) {
                  String allow=c.getHeaderField("Allow");
                  String detail=body.replace("\\r"," ").replace("\\n"," ").trim();
                  if(detail.length()>180) detail=detail.substring(0,180);
                  throw new ApiException(
                      "HEP HTTP "+status+" na "+path+
                      (allow==null?"":" · Allow: "+allow)+
                      (detail.isEmpty()?"":" · "+detail),
                      false
                  );
              }'''
          )

          p.write_text(s, encoding='utf-8')
          print('HEP client patched')
          PY

      - name: Pokreni testove
        run: |
          cd hepmjerenja-android-final
          bash tests/run.sh

      - name: Izradi APK 1.0.2
        run: |
          cd hepmjerenja-android-final
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../HEP-Mjerenja-1.0.2.apk

      - name: Spremi APK
        uses: actions/upload-artifact@v4
        with:
          name: HEP-Mjerenja-Android-1.0.2
          path: HEP-Mjerenja-1.0.2.apk
          if-no-files-found: error

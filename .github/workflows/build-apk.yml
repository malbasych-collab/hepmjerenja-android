name: Izradi HEP Mjerenja APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instaliraj Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Raspakiraj projekt
        run: |
          unzip HEP-Mjerenja-Android-1.0-source.zip
          cd hepmjerenja-android-final
          ls

      - name: Pokreni testove
        run: |
          cd hepmjerenja-android-final
          bash tests/run.sh

      - name: Izradi APK
        run: |
          cd hepmjerenja-android-final
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../HEP-Mjerenja-1.0.0.apk

      - name: Spremi APK
        uses: actions/upload-artifact@v4
        with:
          name: HEP-Mjerenja-Android-1.0.0
          path: HEP-Mjerenja-1.0.0.apk
          if-no-files-found: error
